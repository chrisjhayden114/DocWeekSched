# Optional: in Render Dashboard → New → Blueprint, connect the repo and apply this file.
# Or create a Web Service manually using the same build/start commands.

services:
  - type: web
    name: docweeksched-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@event-app/api && npm run prisma:deploy --workspace=@event-app/api
    startCommand: npm run start --workspace=@event-app/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set explicitly rather than relying on a platform default: NODE_ENV
      # gates Secure session/CSRF cookies (env.ts cookieSecure), the HSTS
      # response header (securityHeaders.ts), and the rate-limiter's test
      # bypass. If this were ever absent the API would boot as "development"
      # and quietly serve non-Secure cookies over HTTPS.
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_BASE_URL
        sync: false
